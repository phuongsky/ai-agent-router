[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-requirement-router"
version = "2.0.0"
description = "IDE-agnostic, local-first requirement router for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AI Requirement Router Contributors" }]
keywords = ["mcp", "agent-skills", "requirements", "git", "ide-agnostic"]
dependencies = ["mcp>=1.28,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
arr = "requirement_router.cli:main"
arr-mcp = "requirement_router.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/requirement_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
